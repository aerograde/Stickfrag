name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-menu:
    name: build + menu/SVG (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.60.0"
      - name: Install browsers (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium firefox webkit
      - name: Install browsers (macOS/Windows)
        if: runner.os != 'Linux'
        run: python -m playwright install chromium firefox webkit
      - name: Build all artifacts
        run: python tools/build-all.py
      - name: Headless menu/SVG matrix (Chromium, Firefox, WebKit)
        run: python tools/ci_menu.py
